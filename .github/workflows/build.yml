name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Build app and installer
        shell: pwsh
        run: ./build/build-installer.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: EyeBreak-Setup
          path: dist/EyeBreak-Setup.exe
          retention-days: 14
